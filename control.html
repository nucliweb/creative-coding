<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#020604">
  <title>Control · Creative Coding</title>
</head>
<body class="control">
  <header>
    <img src="/logo-girotronica.svg" alt="La Girotrònica">
    <span id="conn" class="dot"></span>
  </header>
  <nav id="tabs">
    <button data-mode="rings">ANELLS</button>
    <button data-mode="messages">MISSATGE</button>
    <button data-mode="particles">EIXAM</button>
    <button data-mode="arena">ARENA</button>
  </nav>
  <main>
    <section data-view="idle">
      <p class="pixel big">MIRA LA PANTALLA</p>
      <p class="muted">Aquesta pàgina canviarà sola quan comenci la següent demo.</p>
    </section>
    <section data-view="rings"><div id="sliders"></div></section>
    <section data-view="messages">
      <form id="msg-form" autocomplete="off">
        <label for="msg">Envia una paraula a la pantalla</label>
        <input id="msg" maxlength="20" placeholder="HOLA MÓN" enterkeyhint="send">
        <button type="submit" class="primary">ENVIA ▶</button>
        <p id="msg-status" class="muted"></p>
      </form>
    </section>
    <section data-view="arena">
      <div class="arena-profile">
        <input id="arena-name" maxlength="12" placeholder="EL TEU NOM" autocomplete="off" enterkeyhint="done">
        <div id="swatches"></div>
        <div class="slider"><label>Velocitat<span id="arena-speed-v">2</span></label>
          <input id="arena-speed" type="range" min="1" max="5" step="0.5" value="2"></div>
      </div>
      <div id="arena-score" class="arena-score" hidden>
        <div><span>ELS TEUS XOCS</span><b id="score-hits">0</b></div>
        <div><span>POSICIÓ</span><b id="score-rank">–</b><small id="score-of"></small></div>
      </div>
      <div class="arena-controls">
        <div id="stick"><span id="knob"></span></div>
        <button id="dash" type="button">DASH</button>
      </div>
    </section>
    <section data-view="particles">
      <p class="muted swarm-hint"><i></i>Aquest és el teu color. Arrossega el dit: el teu eixam et seguirà.</p>
      <div id="pad"><span id="me"></span></div>
    </section>
  </main>
  <script type="module" src="/src/control/main.js"></script>
</body>
</html>
